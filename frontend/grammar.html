    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/grammar.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

    <div class="logo">

    <!-- ================= PAGE ================= -->

    <main class="container">

        <h1 class="page-title">

            ✅ Grammar Check

        </h1>

        <p class="page-subtitle">

            Correct grammar, spelling and punctuation using AI.

        </p>

        <!-- ================= INPUT CARD ================= -->

        <section class="card">

            <h2 class="section-title">

                Enter Text

            </h2>

            <div class="form-group">

                <label for="inputText">

                    Email / Text

                </label>

                <textarea
                    id="inputText"
                    placeholder="Paste your email or text here..."></textarea>

            </div>

            <button
                id="grammarBtn"
                class="btn">

                Check Grammar

            </button>

        </section>
                <!-- ================= OUTPUT CARD ================= -->

        <section class="card">

            <h2 class="section-title">

                Corrected Text

            </h2>

            <textarea
                id="correctedText"
                readonly
                placeholder="Corrected text will appear here..."></textarea>

            <div class="button-group">

                <button
                    id="copyBtn"
                    class="btn"
                    disabled>

                    Copy Text

                </button>

            </div>

        </section>

    </main>

    <!-- ================= FOOTER ================= -->
