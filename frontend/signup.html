<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — AI Email Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-card">

    <div class="auth-brand">
      <svg class="auth-brand__mark" width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="5" width="22" height="16" rx="3" stroke="#4F46E5" stroke-width="2"/>
        <path d="M3 8l10 7 10-7" stroke="#4F46E5" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <span class="auth-brand__text">AI Email Assistant</span>
    </div>

    <div class="auth-card__header">
      <h1>Create your account</h1>
      <p>Start writing better emails in minutes.</p>
    </div>

    <button type="button" class="btn btn--google" id="googleSignup">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Sign up with Google
    </button>

    <div class="divider"><span>or with email</span></div>

    <form id="signupForm" novalidate>

      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Ada Lovelace" autocomplete="name" />
        <p class="field__error" id="fullNameError"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="ada@example.com" autocomplete="email" />
        <p class="field__error" id="emailError"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="field__input-wrap">
          <input type="password" id="password" name="password" placeholder="8-16 characters" autocomplete="new-password" maxlength="16" />
          <button type="button" class="toggle-visibility" id="togglePassword" aria-label="Show password">
            <svg class="icon-eye" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 10s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6Z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
              <path d="M1 10s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6Z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M2 2l16 16" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </button>
        </div>
        <div class="strength-meter" id="strengthMeter" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <p class="strength-label" id="strengthLabel">&nbsp;</p>
        <p class="field__error" id="passwordError"></p>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <div class="field__input-wrap">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" maxlength="16" />
          <button type="button" class="toggle-visibility" id="toggleConfirmPassword" aria-label="Show password">
            <svg class="icon-eye" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 10s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6Z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
              <path d="M1 10s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6Z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M2 2l16 16" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </button>
        </div>
        <p class="field__error" id="confirmPasswordError"></p>
      </div>

      <button type="submit" class="btn btn--primary" id="submitBtn">
        <span class="btn__label">Create account</span>
      </button>

      <p class="form-status" id="formStatus" role="status"></p>

    </form>

    <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>

  </div>

  <script src="js/signup.js"></script>
</body>
</html>
