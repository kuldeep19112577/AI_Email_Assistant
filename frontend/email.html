    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/email.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

    <div class="logo">

    <ul class="nav-links">

        <li>

    </ul>

</nav>

    <!-- ================= PAGE ================= -->

    <main class="container">

        <h1 class="page-title">

            📝 Generate Email

        </h1>

        <p class="page-subtitle">

            Generate professional emails using Artificial Intelligence.

        </p>

        <!-- ================= INPUT CARD ================= -->

        <section class="card">

            <h2 class="section-title">

                Email Details

            </h2>

            <div class="form-group">

                <label for="emailType">

                    Email Type

                </label>

                <select id="emailType">

                    <option value="Formal">

                        Formal

                    </option>

                    <option value="Informal">

                        Informal

                    </option>

                    <option value="Business">

                        Business

                    </option>

                    <option value="Leave Request">

                        Leave Request

                    </option>

                    <option value="Meeting Request">

                        Meeting Request

                    </option>

                    <option value="Apology">

                        Apology

                    </option>

                </select>

            </div>

            <div class="form-group">

                <label for="recipient">

                    Recipient

                </label>

                <input
                    type="text"
                    id="recipient"
                    placeholder="Example: HR Manager">

            </div>

            <div class="form-group">

                <label for="tone">

                    Tone

                </label>

                <select id="tone">

                    <option value="Professional">

                        Professional

                    </option>

                    <option value="Friendly">

                        Friendly

                    </option>

                    <option value="Formal">

                        Formal

                    </option>

                    <option value="Polite">

                        Polite

                    </option>

                    <option value="Confident">

                        Confident

                    </option>

                </select>

            </div>
                        <div class="form-group">

                <label for="purpose">

                    Purpose

                </label>

                <textarea
                    id="purpose"
                    placeholder="Describe why you want to send this email..."></textarea>

            </div>

            <button
                id="generateBtn"
                class="btn">

                Generate Email

            </button>

        </section>

        <!-- ================= OUTPUT CARD ================= -->

        <section class="card">

            <h2 class="section-title">

                Generated Email

            </h2>

            <textarea
                id="generatedEmail"
                readonly
                placeholder="Your generated email will appear here..."></textarea>

            <div class="button-group">

                <button
                    id="copyBtn"
                    class="btn"
                    disabled>

                    Copy Email

                </button>

            </div>

        </section>

    </main>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 AI Email Assistant. All Rights Reserved.

    <script src="js/common.js"></script>

</body>
