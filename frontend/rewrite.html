<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Rewrite Email</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/rewrite.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

    <div class="logo">
        AI Email Assistant
    </div>

    <ul class="nav-links">

        <li><a href="index.html">Dashboard</a></li>

        <li><a href="email.html">Generate</a></li>

        <li><a href="rewrite.html" class="active">Rewrite</a></li>

        <li><a href="grammar.html">Grammar</a></li>

        <li><a href="tone.html">Tone</a></li>

        <li><a href="compose.html">Compose</a></li>

        <li><a href="history.html">History</a></li>

    </ul>

</nav>

    <!-- ================= PAGE ================= -->

    <main class="container">

        <h1 class="page-title">

            ✏ Rewrite Email

        </h1>

        <p class="page-subtitle">

            Rewrite your email professionally using AI.

        </p>

        <!-- ================= INPUT CARD ================= -->

        <section class="card">

            <h2 class="section-title">

                Rewrite Details

            </h2>

            <div class="form-group">

                <label for="instruction">

                    Rewrite Instruction

                </label>

                <select id="instruction">

                    <option value="Professional">
                        Professional
                    </option>

                    <option value="Friendly">
                        Friendly
                    </option>

                    <option value="Formal">
                        Formal
                    </option>

                    <option value="Shorter">
                        Shorter
                    </option>

                    <option value="More Polite">
                        More Polite
                    </option>

                    <option value="More Confident">
                        More Confident
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label for="originalEmail">

                    Original Email

                </label>

                <textarea
                    id="originalEmail"
                    placeholder="Paste your email here..."></textarea>

            </div>

            <button
                id="rewriteBtn"
                class="btn">

                Rewrite Email

            </button>

        </section>
                <!-- ================= OUTPUT CARD ================= -->

        <section class="card">

            <h2 class="section-title">

                Rewritten Email

            </h2>

            <textarea
                id="rewrittenEmail"
                readonly
                placeholder="Your rewritten email will appear here..."></textarea>

            <div class="button-group">

                <button
                    id="copyBtn"
                    class="btn"
                    disabled>

                    Copy Email

                </button>

            </div>

        </section>

    </main>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 AI Email Assistant. All Rights Reserved.

        </p>

    </footer>

    <script src="js/common.js"></script>
    <script src="js/rewrite.js"></script>

</body>

</html>
