<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Rewrite Email</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/rewrite.css">

</head>

<body>

    <!-- ================= PAGE ================= -->

    <main class="container">

        <h1 class="page-title">
            <span>✏️</span> Rewrite Email
        </h1>

        <p class="page-subtitle">
            Paste an email and let AI rewrite it professionally.
        </p>

        <div class="split-layout">

            <!-- ================= INPUT CARD ================= -->

            <section class="card">

                <h2 class="section-title">
                    <span>📝</span> Rewrite Details
                </h2>

                <div class="form-group">

                    <label for="instruction">
                        Rewrite Instruction
                    </label>

                    <select id="instruction">

                        <option value="Professional">
                            Professional
                        </option>

                        <option value="Friendly">
                            Friendly
                        </option>

                        <option value="Formal">
                            Formal
                        </option>

                        <option value="Shorter">
                            Shorter
                        </option>

                        <option value="More Polite">
                            More Polite
                        </option>

                        <option value="More Confident">
                            More Confident
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="originalEmail">
                        Original Email
                    </label>

                    <textarea
                        id="originalEmail"
                        placeholder="Paste your email here..."></textarea>

                </div>

                <button
                    id="rewriteBtn"
                    class="btn">
                    ✏️ Rewrite Email
                </button>

            </section>

            <!-- ================= OUTPUT CARD ================= -->

            <section class="card output-card">

                <h2 class="section-title">
                    <span>📩</span> Rewritten Email
                </h2>

                <textarea
                    id="rewrittenEmail"
                    readonly
                    placeholder="Your rewritten email will appear here..."></textarea>

                <div class="button-group">

                    <button
                        id="copyBtn"
                        class="btn btn-secondary"
                        disabled>
                        Copy Email
                    </button>

                </div>

            </section>

        </div>

    </main>

    <script src="js/Api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/rewrite.js"></script>

</body>

</html>
