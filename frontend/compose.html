<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Compose Email</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/compose.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

    <div class="logo">
        AI Email Assistant
    </div>

    <ul class="nav-links">

        <li><a href="index.html">Dashboard</a></li>

        <li><a href="email.html">Generate</a></li>

        <li><a href="rewrite.html">Rewrite</a></li>

        <li><a href="grammar.html">Grammar</a></li>

        <li><a href="tone.html">Tone</a></li>

        <li><a href="compose.html" class="active">Compose</a></li>

        <li><a href="history.html">History</a></li>

    </ul>

</nav>

    <!-- ================= PAGE ================= -->

    <main class="container">

        <h1 class="page-title">

            ✍️ Compose Email

        </h1>

        <p class="page-subtitle">

            Describe your requirement and let AI generate a complete email.

        </p>

        <!-- ================= INPUT CARD ================= -->

        <section class="card">

            <h2 class="section-title">

                Compose Details

            </h2>

            <div class="form-group">

                <label for="prompt">

                    Describe Your Requirement

                </label>

                <textarea
                    id="prompt"
                    placeholder="Example: Write an email to my manager requesting leave tomorrow because I have a fever."></textarea>

            </div>

            <button
                id="composeBtn"
                class="btn">

                Compose Email

            </button>

        </section>

        <!-- ================= OUTPUT CARD ================= -->

        <section class="card">

            <h2 class="section-title">

                Generated Email

            </h2>

            <textarea
                id="generatedEmail"
                readonly
                placeholder="Your generated email will appear here..."></textarea>

            <div class="button-group">

                <button
                    id="copyBtn"
                    class="btn"
                    disabled>

                    Copy Email

                </button>

            </div>

        </section>

    </main>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 AI Email Assistant. All Rights Reserved.

        </p>

    </footer>

    <script src="js/common.js"></script>
    <script src="js/compose.js"></script>

</body>

</html>
