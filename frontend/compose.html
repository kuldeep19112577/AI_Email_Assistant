<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Compose Email</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/compose.css">

</head>

<body>

    <!-- ================= PAGE ================= -->

    <main class="container">

        <h1 class="page-title">
            <span>📧</span> Compose Email
        </h1>

        <p class="page-subtitle">
            Describe your requirement and let AI generate a complete email.
        </p>

        <div class="split-layout">

            <!-- ================= INPUT CARD ================= -->

            <section class="card">

                <h2 class="section-title">
                    <span>📝</span> Compose Details
                </h2>

                <div class="form-group">

                    <label for="prompt">
                        Describe Your Requirement
                    </label>

                    <textarea
                        id="prompt"
                        placeholder="Example: Write an email to my manager requesting leave tomorrow because I have a fever."></textarea>

                </div>

                <button
                    id="composeBtn"
                    class="btn">
                    📧 Compose Email
                </button>

            </section>

            <!-- ================= OUTPUT CARD ================= -->

            <section class="card output-card">

                <h2 class="section-title">
                    <span>📩</span> Generated Email
                </h2>

                <textarea
                    id="generatedEmail"
                    readonly
                    placeholder="Your generated email will appear here..."></textarea>

                <div class="button-group">

                    <button
                        id="copyBtn"
                        class="btn btn-secondary"
                        disabled>
                        Copy Email
                    </button>

                </div>

            </section>

        </div>

    </main>

    <script src="js/Api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/compose.js"></script>

</body>

</html>
