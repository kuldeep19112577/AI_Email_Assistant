<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tone Change</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/tone.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">

            AI Email Assistant

        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="email.html">
                    Generate
                </a>
            </li>

            <li>
                <a href="rewrite.html">
                    Rewrite
                </a>
            </li>

            <li>
                <a href="grammar.html">
                    Grammar
                </a>
            </li>

        </ul>

    </nav>

    <!-- ================= PAGE ================= -->

    <main class="container">

        <h1 class="page-title">

            🎭 Tone Change

        </h1>

        <p class="page-subtitle">

            Change the tone of your email using Artificial Intelligence.

        </p>

        <!-- ================= INPUT CARD ================= -->

        <section class="card">

            <h2 class="section-title">

                Tone Details

            </h2>

            <div class="form-group">

                <label for="tone">

                    Select Tone

                </label>

                <select id="tone">

                    <option value="Professional">
                        Professional
                    </option>

                    <option value="Friendly">
                        Friendly
                    </option>

                    <option value="Formal">
                        Formal
                    </option>

                    <option value="Casual">
                        Casual
                    </option>

                    <option value="Polite">
                        Polite
                    </option>

                    <option value="Confident">
                        Confident
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label for="email">

                    Original Email

                </label>

                <textarea
                    id="email"
                    placeholder="Paste your email here..."></textarea>

            </div>

            <button
                id="toneBtn"
                class="btn">

                Change Tone

            </button>

        </section>
                <!-- ================= OUTPUT CARD ================= -->

        <section class="card">

            <h2 class="section-title">

                Modified Email

            </h2>

            <textarea
                id="modifiedEmail"
                readonly
                placeholder="Your modified email will appear here..."></textarea>

            <div class="button-group">

                <button
                    id="copyBtn"
                    class="btn"
                    disabled>

                    Copy Email

                </button>

            </div>

        </section>

    </main>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 AI Email Assistant. All Rights Reserved.

        </p>

    </footer>

    <script src="js/common.js"></script>
    <script src="js/tone.js"></script>

</body>

</html>
