services:
  mysql:
    image: mysql:8.0
    container_name: ai-email-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Shekhawat##12
      MYSQL_DATABASE: ai_email_assistant
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: ai-email-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai-email-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
